<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>橙子音乐 · iPhone 机型模拟器（本地测试版）</title>
<style>
  :root {
    --w: 393px; --h: 852px; --r: 48px;
    --stop: 59px; --sbot: 34px;
    --line: rgba(255,255,255,.09);
    --ink: #f2f4f8; --ink2: #9aa2b1; --brand: #ff7a1a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; min-height: 100%; overflow: hidden;
    background: radial-gradient(1100px 700px at 62% 18%, #20242e 0%, #0c0e12 62%, #08090c 100%);
    color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 控制台 ─────────────────────────────────── */
  .panel {
    flex: none; width: 258px; padding: 22px 18px;
    background: rgba(16,18,23,.92); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 18px; overflow: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(145deg, #ff9a45, #f2600a);
    box-shadow: 0 4px 14px rgba(242,96,10,.35);
  }
  .brand b { display: block; font-size: 14px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--ink2); font-size: 11px; margin-top: 1px; }
  .grp { display: flex; flex-direction: column; gap: 9px; }
  .grp > label.h { color: var(--ink2); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg.seg3 { grid-template-columns: repeat(3, 1fr); }
  .seg.seg4 { grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .seg.seg4 button { padding: 7px 2px; font-size: 11px; }
  .seg.gens { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .seg.gens button { padding: 7px 2px; font-size: 11px; }
  .seg.models { grid-template-columns: repeat(2, 1fr); }
  .seg button {
    padding: 8px 6px; border: 1px solid var(--line); border-radius: 9px;
    background: rgba(255,255,255,.035); color: var(--ink2); font-size: 11.5px;
    cursor: pointer; transition: .16s ease; text-align: center; line-height: 1.3;
  }
  .seg button:hover { color: var(--ink); border-color: rgba(255,255,255,.22); }
  .seg button.on {
    color: #fff; border-color: rgba(255,122,26,.75);
    background: linear-gradient(145deg, rgba(255,122,26,.28), rgba(255,122,26,.10));
  }
  .sw { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
  .sw input { position: absolute; opacity: 0; pointer-events: none; }
  .sw span { width: 32px; height: 18px; border-radius: 999px; flex: none; position: relative; background: #343942; transition: .2s ease; }
  .sw span::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #cdd2dc; transition: .2s ease;
  }
  .sw input:checked + span { background: var(--brand); }
  .sw input:checked + span::after { transform: translateX(14px); background: #fff; }
  .sw:has(input:checked) { color: var(--ink); }
  select, .acts button {
    width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: #20232b; color: var(--ink); font-size: 12px; cursor: pointer;
  }
  .spec {
    font-size: 10.5px; line-height: 1.65; color: var(--ink2);
    padding: 7px 9px; border-radius: 8px;
    background: rgba(255,255,255,.035); border: 1px solid var(--line);
  }
  .spec b { color: var(--ink); font-weight: 600; }
  select:focus, .acts button:focus-visible { outline: 2px solid rgba(255,122,26,.7); }
  .acts { display: flex; flex-direction: column; gap: 7px; }
  .acts button:hover { border-color: rgba(255,122,26,.6); }
  .acts a { color: var(--ink2); font-size: 11.5px; text-align: center; text-decoration: none; margin-top: 2px; }
  .acts a:hover { color: var(--brand); }
  .note {
    margin-top: auto; padding: 10px 11px; border-radius: 9px; font-size: 11px; line-height: 1.7;
    color: var(--ink2); background: rgba(255,255,255,.035); border: 1px solid var(--line);
  }
  .note b { color: var(--ink); font-weight: 600; }
  .note.warn { color: #ffcfae; border-color: rgba(255,122,26,.5); }
  .note a { color: var(--brand); }

  /* ── 舞台 ───────────────────────────────────── */
  /* 用 margin:auto 居中而不是 align-items:center：内容略大于舞台时，
     flex 居中会把顶部裁掉且滚动条够不到；margin:auto 会自动退回左上并可完整滚动。 */
  .stage { flex: 1; min-width: 0; min-height: 0; position: relative; display: flex; align-items: flex-start; justify-content: flex-start; overflow: auto; padding: 22px; }
  .wrap { flex: none; margin: auto; }
  .device {
    width: var(--w); height: var(--h); padding: 11px;
    box-sizing: content-box; position: relative;
    border-radius: calc(var(--r) + 11px);
    background: linear-gradient(140deg, #8f929a 0%, #3c3f45 11%, #1b1d21 29%, #74777f 48%, #24262b 67%, #8d9098 87%, #2b2d32 100%);
    box-shadow: 0 0 0 1px #08090b, 0 34px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.14);
    transform-origin: top left;
  }
  .screen {
    width: 100%; height: 100%; position: relative; overflow: hidden;
    border-radius: var(--r); background: #0f1013;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.85);
  }
  #app { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0f1013; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .side { position: absolute; width: 3px; border-radius: 2px; background: linear-gradient(90deg,#5b5e66,#23252a); }
  .silent { left: -3px; top: 132px; height: 30px; }
  .volup  { left: -3px; top: 186px; height: 58px; }
  .voldn  { left: -3px; top: 254px; height: 58px; }
  .power  { right: -3px; top: 206px; height: 92px; }

  /* 状态栏（black-translucent：透明覆盖在页面上） */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: var(--stop);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 27px; color: #fff; font-size: 15px; font-weight: 650;
    letter-spacing: .2px; pointer-events: none; z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .statusbar .icons { display: flex; align-items: center; gap: 5px; }
  .statusbar.compact { height: var(--stop); padding: 0 18px; font-size: 11px; background: #0f1013; }

  .island, .notch { display: none; position: absolute; z-index: 5; pointer-events: none; }
  .screen[data-cut="island"] .island,
  .screen[data-cut="islandSmall"] .island { display: flex; }
  .screen[data-cut="notch"]  .notch  { display: block; }
  /* iPhone 18 Pro：Face ID 红外移到屏下，灵动岛比 14~17 Pro 更窄更矮 */
  .screen[data-cut="islandSmall"] .island { width: 96px; height: 30px; top: 13px; border-radius: 15px; padding-right: 11px; }
  .screen[data-cut="islandSmall"] .island .cam { width: 9px; height: 9px; }
  .screen[data-cut="islandSmall"] .island .sensor { width: 5px; height: 5px; }
  .island {
    top: 11px; left: 50%; transform: translateX(-50%);
    width: 125px; height: 36px; border-radius: 20px; background: #000;
    align-items: center; justify-content: flex-end; padding-right: 13px; gap: 9px;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.07), inset 0 0 3px #141414;
  }
  .island i { display: block; border-radius: 50%; }
  .island .sensor { width: 7px; height: 7px; background: #171a22; box-shadow: inset 0 0 2px #2b3140; }
  .island .cam { width: 12px; height: 12px; background: radial-gradient(circle at 32% 30%, #3b5578 0%, #101a2a 45%, #05070c 100%); box-shadow: inset 0 0 0 1px rgba(120,160,220,.18); }
  .notch { top: 0; left: 50%; transform: translateX(-50%); width: 164px; height: 32px; background: #000; border-radius: 0 0 19px 19px; }
  .notch::before { content: ''; position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 54px; height: 5px; border-radius: 3px; background: #17191e; }
  .notch::after { content: ''; position: absolute; top: 9px; right: 24px; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a3c58, #05070c 70%); }
  .home {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.9); z-index: 4; pointer-events: none;
  }

  /* 安全区标线 */
  .safes { display: none; position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .safes.on { display: block; }
  .safe-t, .safe-b { position: absolute; left: 0; right: 0; }
  .safe-t { top: 0; height: var(--stop); background: rgba(255,72,72,.13); border-bottom: 1px dashed rgba(255,96,96,.8); }
  .safe-b { bottom: 0; height: var(--sbot); background: rgba(64,156,255,.13); border-top: 1px dashed rgba(90,170,255,.8); }
  .safe-t span, .safe-b span { position: absolute; left: 8px; font-size: 9px; font-weight: 600; color: #fff; background: rgba(0,0,0,.55); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
  .safe-t span { bottom: 3px; }
  .safe-b span { top: 3px; }

  /* 手势可视化 */
  .finger {
    position: absolute; left: 0; top: 0; width: 38px; height: 38px; border-radius: 50%;
    z-index: 9; pointer-events: none; display: none; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,.32) 0%, rgba(255,255,255,.10) 58%, transparent 74%);
    border: 1.5px solid rgba(255,255,255,.8);
    box-shadow: 0 0 20px rgba(255,255,255,.3), inset 0 0 12px rgba(255,255,255,.16);
  }
  .finger.on { display: block; }
  .gesture-hud {
    position: absolute; top: calc(var(--stop) + 12px); left: 50%; z-index: 10;
    transform: translateX(-50%) translateY(-6px); opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    font-size: 11px; font-weight: 600; color: #fff;
    background: rgba(20,22,28,.82); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(12px);
  }
  .gesture-hud.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hint { position: absolute; right: 16px; bottom: 10px; color: rgba(255,255,255,.32); font-size: 11px; pointer-events: none; }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    .panel {
      width: 100%; max-height: none; padding: 10px 14px; gap: 8px 14px;
      flex-direction: row; flex-wrap: wrap; align-items: center;
      border-right: 0; border-bottom: 1px solid var(--line); overflow: visible;
    }
    .brand small, .note, .hint, .spec { display: none; }
    .brand b { font-size: 12px; }
    .brand .dot { width: 22px; height: 22px; border-radius: 7px; }
    .grp { flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grp > label.h, .acts a { display: none; }
    .seg { display: flex; flex-wrap: wrap; }
    .seg button { padding: 6px 9px; white-space: nowrap; }
    .seg.gens button { padding: 6px 10px; }
    .sw { font-size: 11px; }
    select { width: auto; }
    .acts { flex-direction: row; flex-wrap: wrap; }
    .acts button { width: auto; padding: 6px 9px; white-space: nowrap; }
    .stage { padding: 12px; }
  }
</style>
</head>
<body>
<aside class="panel">
  <div class="brand">
    <span class="dot"></span>
    <div><b>iPhone 机型模拟器</b><small>橙子音乐 · 本地测试版</small></div>
  </div>

  <div class="grp">
    <label class="h">机型 / 安全区</label>
    <div class="seg gens" id="deviceGens"></div>
    <div class="seg models" id="deviceModels"></div>
    <div class="spec" id="deviceSpec"></div>
  </div>

  <div class="grp">
    <label class="h">上下滑作用于</label>
    <div class="seg seg3" id="gestureModes">
      <button type="button" data-mode="auto" class="on">自动</button>
      <button type="button" data-mode="page">翻页</button>
      <button type="button" data-mode="song">切歌</button>
    </div>
  </div>

  <div class="grp">
    <label class="h">显示</label>
    <label class="sw"><input type="checkbox" id="showStatus" checked><span></span>状态栏·灵动岛</label>
    <label class="sw"><input type="checkbox" id="showSafe"><span></span>安全区标线</label>
    <label class="sw"><input type="checkbox" id="showHome" checked><span></span>Home 条</label>
    <label class="sw"><input type="checkbox" id="gestureOn" checked><span></span>手势模拟</label>
    <label class="sw"><input type="checkbox" id="showTouch" checked><span></span>显示触点</label>
  </div>

  <div class="grp">
    <label class="h">缩放</label>
    <div class="seg seg4" id="scaleModes">
      <button type="button" data-scale="auto" class="on">自适应</button>
      <button type="button" data-scale="1">100%</button>
      <button type="button" data-scale="0.75">75%</button>
      <button type="button" data-scale="0.5">50%</button>
    </div>
  </div>

  <div class="acts">
    <button id="swipeUp">模拟上滑 ↑</button>
    <button id="swipeDown">模拟下滑 ↓</button>
    <button id="reload">刷新页面</button>
    <button id="hard">强制刷新（绕缓存）</button>
    <a href="/" target="_blank" rel="noopener">单独打开测试版 ↗</a>
  </div>

  <div class="note" id="note">正在载入…</div>
</aside>

<main class="stage" id="stage">
  <div class="wrap" id="wrap">
    <div class="device" id="device">
      <i class="side silent"></i><i class="side volup"></i><i class="side voldn"></i><i class="side power"></i>
      <div class="screen" id="screen" data-cut="island">
        <iframe id="app" title="橙子音乐测试版"></iframe>

        <div class="statusbar" id="statusbar">
          <span class="clock" id="clock">9:41</span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3.5" width="3" height="8.5" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="10" r="1" fill="#fff" stroke="none"/></svg>
            <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".55"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#fff"/><path d="M24 4.2v4.6a2.6 2.6 0 0 0 0-4.6z" fill="#fff" fill-opacity=".55"/></svg>
          </span>
        </div>

        <div class="island"><i class="sensor"></i><i class="cam"></i></div>
        <div class="notch"></div>
        <div class="home" id="home"></div>

        <div class="safes" id="safes">
          <div class="safe-t"><span id="safeTLabel"></span></div>
          <div class="safe-b"><span id="safeBLabel"></span></div>
        </div>

        <div class="finger" id="finger"></div>
        <div class="gesture-hud" id="gestureHud"></div>
      </div>
    </div>
  </div>
  <div class="hint">按住手机屏幕上下拖动，即可在应用内翻页 / 切歌</div>
</main>

<script>
  // 逻辑分辨率（pt = CSS px）、屏幕圆角、竖屏安全区，对应 standalone 下 env(safe-area-inset-*)。
  // 规格来源：Use Your Loaf「iPhone 17 Screen Sizes」、screensizes / bestlatestapps 设备表、
  // 国内 iOS 适配对照表；iPhone 18 Pro 的灵动岛因 Face ID 红外移到屏下而缩小。
  // g = 代、k = 型号（pro / max / se）：用「代 + 型号」两组固定按钮选机型，
  // 不用原生 <select> —— 13 项长下拉由浏览器独立渲染，展开后位置容易漂移、遮挡机身。
  const DEVICES = [
    { id:'13p',  g:'13',   k:'pro', name:'iPhone 13 Pro',         w:390, h:844, r:47, top:47, bot:34, cut:'notch'       },
    { id:'13pm', g:'13',   k:'max', name:'iPhone 13 Pro Max',     w:428, h:926, r:53, top:47, bot:34, cut:'notch'       },
    { id:'14p',  g:'14',   k:'pro', name:'iPhone 14 Pro',         w:393, h:852, r:55, top:59, bot:34, cut:'island'      },
    { id:'14pm', g:'14',   k:'max', name:'iPhone 14 Pro Max',     w:430, h:932, r:55, top:59, bot:34, cut:'island'      },
    { id:'15p',  g:'15',   k:'pro', name:'iPhone 15 Pro',         w:393, h:852, r:55, top:59, bot:34, cut:'island'      },
    { id:'15pm', g:'15',   k:'max', name:'iPhone 15 Pro Max',     w:430, h:932, r:55, top:59, bot:34, cut:'island'      },
    { id:'16p',  g:'16',   k:'pro', name:'iPhone 16 Pro',         w:402, h:874, r:62, top:62, bot:34, cut:'island'      },
    { id:'16pm', g:'16',   k:'max', name:'iPhone 16 Pro Max',     w:440, h:956, r:62, top:62, bot:34, cut:'island'      },
    { id:'17p',  g:'17',   k:'pro', name:'iPhone 17 Pro',         w:402, h:874, r:62, top:62, bot:34, cut:'island'      },
    { id:'17pm', g:'17',   k:'max', name:'iPhone 17 Pro Max',     w:440, h:956, r:62, top:62, bot:34, cut:'island'      },
    { id:'18p',  g:'18',   k:'pro', name:'iPhone 18 Pro',         w:402, h:874, r:62, top:62, bot:34, cut:'islandSmall' },
    { id:'18pm', g:'18',   k:'max', name:'iPhone 18 Pro Max',     w:440, h:956, r:62, top:62, bot:34, cut:'islandSmall' },
    { id:'se3',  g:'对照', k:'se',  name:'iPhone SE 3（无刘海）',  w:375, h:667, r:12, top:20, bot:0,  cut:'none'       },
  ]
  const CUT_TEXT = { island: '灵动岛', islandSmall: '小灵动岛', notch: '刘海', none: '无刘海' }
  const KIND_TEXT = { pro: 'Pro', max: 'Pro Max', se: 'SE 3' }

  const $ = (id) => document.getElementById(id)
  const frame = $('app')
  // 默认延续 393×852 / 59pt 基准；链接参数：?d=18pm 指定机型、?m=page|song|auto 指定手势模式
  const urlOpt = new URLSearchParams(location.search)
  const initialId = urlOpt.get('d')
  let current = DEVICES.find((d) => d.id === initialId) || DEVICES.find((d) => d.id === '15p') || DEVICES[0]
  let gestureMode = ['auto', 'page', 'song'].includes(urlOpt.get('m')) ? urlOpt.get('m') : 'auto'
  // 页面里不使用任何原生 <select>：它的展开层由浏览器单独渲染，在预览面板中会漂移
  let scaleMode = ['auto', '1', '0.75', '0.5'].includes(urlOpt.get('s')) ? urlOpt.get('s') : 'auto'

  function renderDeviceButtons() {
    const gens = [...new Set(DEVICES.map((d) => d.g))]
    $('deviceGens').innerHTML = gens.map((g) =>
      `<button type="button" data-g="${g}" class="${g === current.g ? 'on' : ''}">${g}</button>`
    ).join('')
    $('deviceModels').innerHTML = DEVICES.filter((d) => d.g === current.g).map((d) =>
      `<button type="button" data-id="${d.id}" class="${d.id === current.id ? 'on' : ''}">${KIND_TEXT[d.k]}</button>`
    ).join('')
  }
  function selectDevice(d) {
    if (!d || d.id === current.id) return
    current = d
    renderDeviceButtons()
    applyDevice()
    syncSimCss()   // 只换同源 CSS，不重载 iframe、不打断播放
  }
  $('deviceGens').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-g]')
    if (!b) return
    const next = DEVICES.find((d) => d.g === b.dataset.g && d.k === current.k)
      || DEVICES.find((d) => d.g === b.dataset.g)
    selectDevice(next)
  })
  $('deviceModels').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-id]')
    if (b) selectDevice(DEVICES.find((d) => d.id === b.dataset.id))
  })
  renderDeviceButtons()
  $('gestureModes').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]')
    if (!b) return
    gestureMode = b.dataset.mode
    ;[...$('gestureModes').children].forEach((x) => x.classList.toggle('on', x.dataset.mode === gestureMode))
    note()
  })

  function cssVars(d) {
    const root = document.documentElement.style
    root.setProperty('--w', d.w + 'px')
    root.setProperty('--h', d.h + 'px')
    root.setProperty('--r', d.r + 'px')
    root.setProperty('--stop', d.top + 'px')
    root.setProperty('--sbot', d.bot + 'px')
  }
  function applyDevice() {
    const d = current
    cssVars(d)
    $('screen').dataset.cut = d.cut
    $('statusbar').classList.toggle('compact', d.cut === 'none')
    $('safeTLabel').textContent = `safe-area-inset-top · ${d.top}px`
    $('safeBLabel').textContent = `safe-area-inset-bottom · ${d.bot}px`
    $('deviceSpec').innerHTML = `<b>${d.w} × ${d.h} pt</b> · ${CUT_TEXT[d.cut]}<br>` +
      `安全区 top <b>${d.top}</b> / bottom <b>${d.bot}</b> pt · 圆角 ${d.r}pt`
    applyToggles()
    fit()
    note()
  }
  function applyToggles() {
    const showStatus = $('showStatus').checked
    $('statusbar').style.display = showStatus ? '' : 'none'
    document.querySelector('.island').style.display = showStatus ? '' : 'none'
    document.querySelector('.notch').style.display = showStatus ? '' : 'none'
    $('safes').classList.toggle('on', $('showSafe').checked)
    $('home').style.display = ($('showHome').checked && current.bot > 0) ? '' : 'none'
    if (!$('showTouch').checked) finger(0, 0, false)
  }

  // 覆盖 :root 的 --safe-t / --safe-b；页面 CSP 禁止内联 style，
  // 所以由服务端返回同源外部 CSS，这里只改 link 的 href。
  function syncSimCss() {
    let doc = null
    try { doc = frame.contentDocument } catch { /* 跨域：不该发生 */ }
    const link = doc && doc.getElementById('__iphoneSimCss')
    if (link) link.setAttribute('href', `/__iphone.css?top=${current.top}&bottom=${current.bot}`)
  }
  function loadApp(hard) {
    frame.src = `/?__sim=1&__top=${current.top}&__bot=${current.bot}` + (hard ? `&t=${Date.now()}` : '')
  }
  function note(warn, html) {
    const el = $('note')
    el.classList.toggle('warn', !!warn)
    if (html) { el.innerHTML = html; return }
    const modeText = { auto: '按落点自动判断', page: '强制滚动翻页', song: '强制切歌' }[gestureMode]
    el.innerHTML = `正在以 <b>${current.name}</b> 模拟：顶部安全区 <b>${current.top}px</b>、底部 <b>${current.bot}px</b>；内容从安全区下方再留 8px。<br><br>` +
      `<b>上下滑只作用于橙子音乐内部</b>（${modeText}）：<br>` +
      `· 播放页 / 底部 dock → 派发 touch 手势，上滑下一首、下滑上一首<br>` +
      `· 列表 / 内容区 → 滚动翻页，带惯性与边缘回弹<br>` +
      `系统手势（控制中心、回主屏）不在模拟范围内。`
  }
  function fit() {
    const s0 = scaleMode
    const W = current.w + 22, H = current.h + 22
    let s = 1
    if (s0 === 'auto') {
      // 优先用舞台真实可见尺寸；控制台换行 / 预览面板尺寸变化后由 ResizeObserver 重算
      const narrow = window.innerWidth <= 900
      const panelH = narrow ? (document.querySelector('.panel')?.getBoundingClientRect().height || 0) : 0
      const st = $('stage').getBoundingClientRect()
      const availW = (st.width > 160 ? st.width : window.innerWidth - (narrow ? 0 : 258)) - 28
      const availH = (st.height > 200 ? st.height : window.innerHeight - panelH) - 28
      s = Math.min(1, availW / W, availH / H)
      s = Math.max(.2, Math.round(s * 100) / 100)
    } else s = Number(s0)
    $('wrap').style.width = Math.round(W * s) + 'px'
    $('wrap').style.height = Math.round(H * s) + 'px'
    $('device').style.transform = `scale(${s})`
  }
  function tick() {
    const d = new Date()
    $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0')
  }

  // ── 应用内手势 ───────────────────────────────────
  // 监听绑在 iframe 内部 document 上（同源），全程 passive、不 preventDefault：
  // 单击、输入框、播放按钮照常工作；只有移动超过 7px 才判定为滑动。
  // 应用自己的手势契约（ios/shared/ui/app.js）：
  //   · #nowPlaying 整页 touchstart/touchmove/touchend，|dy|>46 且 800ms 内 → next(±1)
  //   · #tabbar 中央胶囊 touchstart/touchend，|dy|>28 → next(±1)
  // 所以切歌不是模拟器自己换歌，而是把鼠标拖拽转成应用能识别的 TouchEvent。
  const G = {
    active: false, mode: 'page', x0: 0, y0: 0, lastY: 0, lastT: 0,
    vel: 0, scroller: null, startTop: 0, moved: false, target: null, blockClick: false,
  }
  const gestureEnabled = () => $('gestureOn').checked
  const touchVisible = () => $('showTouch').checked

  function hud(text, ms) {
    const el = $('gestureHud')
    if (!text) { el.classList.remove('on'); return }
    el.textContent = text
    el.classList.add('on')
    if (ms) setTimeout(() => { if (el.textContent === text) el.classList.remove('on') }, ms)
  }
  function finger(x, y, on) {
    const el = $('finger')
    el.classList.toggle('on', !!on && touchVisible())
    if (on) { el.style.left = x + 'px'; el.style.top = y + 'px' }
  }
  function findScroller(doc, node) {
    let el = node
    while (el && el.nodeType === 1 && el !== doc.documentElement) {
      const st = doc.defaultView.getComputedStyle(el)
      if (/(auto|scroll|overlay)/.test(st.overflowY) && el.scrollHeight > el.clientHeight + 2) return el
      el = el.parentNode
    }
    const se = doc.scrollingElement || doc.documentElement
    return se && se.scrollHeight > se.clientHeight + 2 ? se : null
  }
  function mainScroller(doc) {
    let best = null, bestH = 0
    for (const el of doc.querySelectorAll('*')) {
      if (el.scrollHeight <= el.clientHeight + 8) continue
      if (!/(auto|scroll|overlay)/.test(doc.defaultView.getComputedStyle(el).overflowY)) continue
      if (el.clientHeight > bestH) { best = el; bestH = el.clientHeight }
    }
    return best
  }
  function inertia(el, vel) {
    if (!el || !isFinite(vel) || Math.abs(vel) < 0.05) return
    let v = Math.max(-2.6, Math.min(2.6, vel))
    let last = performance.now()
    const step = (now) => {
      const dt = Math.min(34, now - last); last = now
      const before = el.scrollTop
      el.scrollTop = before - v * dt
      if (el.scrollTop === before) return
      v *= Math.pow(0.93, dt / 16)
      if (Math.abs(v) > 0.02) requestAnimationFrame(step)
    }
    requestAnimationFrame(step)
  }
  // 应用内绑了切歌手势的两个根元素（优先播放页，其次 dock）
  function appGestureTarget(doc) {
    const np = doc.getElementById('nowPlaying')
    if (np && np.getClientRects().length) return np
    const bar = doc.getElementById('tabbar')
    if (bar && bar.getClientRects().length) return bar
    return null
  }
  function resolveMode(el) {
    if (gestureMode === 'page') return 'page'
    if (gestureMode === 'song') return 'song'
    return el && el.closest && (el.closest('#nowPlaying') || el.closest('#tabbar')) ? 'song' : 'page'
  }
  // 构造真实 TouchEvent 序列并派发给应用：整段同步执行，确保落在应用 800ms 手势窗口内
  function dispatchSwipe(doc, dy) {
    const W = frame.contentWindow
    const el = appGestureTarget(doc)
    if (!el || !W.Touch || !W.TouchEvent) return false
    const x = current.w / 2, y0 = current.h * .55, y1 = y0 + dy
    const send = (type, y, end) => {
      const t = new W.Touch({ identifier: 1, target: el, clientX: x, clientY: y, pageX: x, pageY: y, radiusX: 12, radiusY: 12, force: 1 })
      el.dispatchEvent(new W.TouchEvent(type, {
        bubbles: true, cancelable: true, view: W,
        touches: end ? [] : [t], targetTouches: end ? [] : [t], changedTouches: [t],
      }))
    }
    send('touchstart', y0, false)
    send('touchmove', y0 + dy * .35, false)
    send('touchmove', y0 + dy * .75, false)
    send('touchend', y1, true)
    return true
  }

  function onDown(e) {
    if (!gestureEnabled() || e.button !== 0) return
    if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]')) return
    const doc = e.target.ownerDocument
    G.active = true
    G.mode = resolveMode(e.target)
    G.x0 = e.clientX; G.y0 = e.clientY; G.lastY = e.clientY
    G.lastT = performance.now(); G.vel = 0
    G.scroller = G.mode === 'page' ? findScroller(doc, e.target) : null
    G.startTop = G.scroller ? G.scroller.scrollTop : 0
    G.moved = false; G.target = e.target
    finger(e.clientX, e.clientY, true)
    try { doc.body.style.userSelect = 'none' } catch { /* ignore */ }
  }
  function onMove(e) {
    if (!G.active) return
    const dy = e.clientY - G.y0, dx = e.clientX - G.x0
    const now = performance.now(), dt = Math.max(1, now - G.lastT)
    G.vel = (e.clientY - G.lastY) / dt
    G.lastY = e.clientY; G.lastT = now
    finger(e.clientX, e.clientY, true)
    if (!G.moved && Math.abs(dy) < 7 && Math.abs(dx) < 7) return
    G.moved = true
    if (Math.abs(dy) <= Math.abs(dx) * 0.8) return

    if (G.mode === 'song') {
      hud((dy < 0 ? '上滑 → 下一首' : '下滑 → 上一首') + ' · ' + Math.round(Math.abs(dy)) + 'px（松手触发）')
      return
    }
    if (!G.scroller) {
      hud('当前页无可滚动内容 · 可打开乐库 / 播放列表测试翻页', 1200)
      return
    }
    const want = G.startTop - dy
    const max = G.scroller.scrollHeight - G.scroller.clientHeight
    // 只改滚动容器的 scrollTop；不动 iframe 的 transform，避免拖拽中命中区域漂移
    G.scroller.scrollTop = Math.max(0, Math.min(max, want))
    hud((dy < 0 ? '上滑' : '下滑') + ' · 翻页 ' + Math.round(Math.abs(dy)) + 'px')
  }
  // 拖拽结束浏览器仍会派发一次 click；不挡住就会点在滚动后的列表行上误点歌，
  // 或在播放页误进歌词页。应用自己的 dock 手势也是用时间戳做同样的事。
  function onClick(e) {
    if (!G.blockClick) return
    G.blockClick = false
    e.preventDefault()
    e.stopPropagation()
  }
  function onUp(e) {
    if (!G.active) return
    G.active = false
    if (G.moved) {
      G.blockClick = true
      setTimeout(() => { G.blockClick = false }, 400)
    }
    const doc = frame.contentDocument
    try { if (doc && doc.body) doc.body.style.userSelect = '' } catch { /* ignore */ }
    finger(0, 0, false)
    const y = e && typeof e.clientY === 'number' ? e.clientY : G.lastY
    const dy = y - G.y0

    if (G.mode === 'song' && Math.abs(dy) >= 46) {
      // 归一到至少 60px，稳过应用播放页 46px / dock 28px 的阈值
      const d = dy < 0 ? -Math.max(60, -dy) : Math.max(60, dy)
      const ok = dispatchSwipe(doc, d)
      hud(ok ? (dy < 0 ? '上滑 → 下一首（已触发应用手势）' : '下滑 → 上一首（已触发应用手势）') : '应用未找到切歌手势区', 1800)
    } else if (G.mode === 'song' && Math.abs(dy) >= 12) {
      hud('滑动不足 46px，未触发切歌', 1500)
    } else if (G.mode === 'page') {
      inertia(G.scroller, G.vel)
      hud('')
    }
  }
  function bindGestures(doc) {
    if (!doc) return
    const opt = { capture: true, passive: true }
    doc.addEventListener('pointerdown', onDown, opt)
    doc.addEventListener('pointermove', onMove, opt)
    doc.addEventListener('pointerup', onUp, opt)
    doc.addEventListener('pointercancel', onUp, opt)
    doc.addEventListener('click', onClick, { capture: true, passive: false })
    // window 捕获比 document 更早，确保应用的委托监听也收不到这次误触 click
    try { frame.contentWindow.addEventListener('click', onClick, { capture: true, passive: false }) } catch { /* ignore */ }
  }

  // 一键演示：不拖拽也能触发同样的应用内动作
  function demoSwipe(dir) {
    const doc = frame.contentDocument
    if (!doc) return
    const useSong = gestureMode === 'song' || (gestureMode === 'auto' && appGestureTarget(doc))
    const dy = dir === 'up' ? -140 : 140
    const y0 = dir === 'up' ? current.h * .7 : current.h * .34
    const y1 = y0 - dy * .8
    finger(current.w / 2, y0, true)
    const scroller = useSong ? null : mainScroller(doc)
    if (useSong) {
      const ok = dispatchSwipe(doc, dy)
      hud(ok ? (dir === 'up' ? '上滑 → 下一首（已触发应用手势）' : '下滑 → 上一首（已触发应用手势）') : '应用未找到切歌手势区', 1800)
    } else hud(dir === 'up' ? '上滑 · 翻页' : '下滑 · 翻页')
    const t0 = performance.now(), dur = 620
    const anim = (now) => {
      const p = Math.min(1, (now - t0) / dur)
      const e = 1 - Math.pow(1 - p, 3)
      finger(current.w / 2, y0 + (y1 - y0) * e, true)
      if (scroller) scroller.scrollTop += dir === 'up' ? 9 : -9
      if (p < 1) requestAnimationFrame(anim)
      else { finger(0, 0, false); if (!useSong) hud('') }
    }
    requestAnimationFrame(anim)
  }

  frame.addEventListener('load', () => {
    let doc = null
    try { doc = frame.contentDocument } catch { /* ignore */ }
    if (!doc || !doc.getElementById('__iphoneSimCss')) {
      note(true, 'iframe 未拿到测试版页面（可能被 CSP 拦截或服务未重启）。<a href="/" target="_blank">单独打开测试版</a>')
      return
    }
    syncSimCss()
    bindGestures(doc)
    note()
  })

  ;['showStatus', 'showSafe', 'showHome', 'showTouch'].forEach((id) => $(id).addEventListener('change', applyToggles))
  $('gestureOn').addEventListener('change', () => { if (!gestureEnabled()) { finger(0, 0, false); hud('') } })
  $('scaleModes').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scale]')
    if (!b) return
    scaleMode = b.dataset.scale
    ;[...$('scaleModes').children].forEach((x) => x.classList.toggle('on', x.dataset.scale === scaleMode))
    fit()
  })
  $('swipeUp').addEventListener('click', () => demoSwipe('up'))
  $('swipeDown').addEventListener('click', () => demoSwipe('down'))
  $('reload').addEventListener('click', () => loadApp(false))
  $('hard').addEventListener('click', () => loadApp(true))
  window.addEventListener('resize', fit)
  window.addEventListener('pointerup', () => { if (G.active) onUp() })

  ;[...$('gestureModes').children].forEach((x) => x.classList.toggle('on', x.dataset.mode === gestureMode))
  ;[...$('scaleModes').children].forEach((x) => x.classList.toggle('on', x.dataset.scale === scaleMode))
  tick()
  setInterval(tick, 30000)
  applyDevice()
  loadApp(false)
  // 首帧布局稳定后再算一次；控制台换行、预览面板尺寸变化都靠 ResizeObserver 兜底
  requestAnimationFrame(fit)
  window.addEventListener('load', fit)
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('stage'))
</script>
</body>
</html>
